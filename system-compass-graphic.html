<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>margo. — System Compass & Tool Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #F5F3FA;
      --bg-card: #FFFFFF;
      --border-subtle: rgba(124, 58, 237, 0.12);
      --text-primary: #1E1B4B;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --violet-primary: #7C3AED;
      --violet-light: #EDE9FE;
      --teal-primary: #0D9488;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-page);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(167, 139, 250, 0.12), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(13, 148, 136, 0.08), transparent 40%);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 80px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .brand-mark {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 700;
      font-style: italic;
      color: var(--violet-primary);
      text-decoration: none;
      display: inline-flex;
      align-items: baseline;
    }
    .brand-dot { color: var(--teal-primary); }

    .action-controls {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(124, 58, 237, 0.04);
      transition: all 0.16s ease;
    }
    .action-btn:hover {
      color: var(--violet-primary);
      border-color: var(--violet-primary);
      transform: translateY(-1px);
    }

    /* Graphic Display Card */
    .graphic-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 28px;
      padding: 16px;
      box-shadow: 0 16px 40px -10px rgba(124, 58, 237, 0.07), 0 3px 8px rgba(15, 23, 42, 0.02);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .graphic-card object {
      width: 100%;
      height: auto;
      min-height: 500px;
      display: block;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      background: #1E1B4B;
      color: #FFFFFF;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div class="container">
    <header class="top-header">
      <a href="index.html" class="brand-mark">margo<span class="brand-dot">.</span></a>
      <div class="action-controls">
        <button class="action-btn" onclick="copySvg()">📋 Copy SVG Code</button>
        <button class="action-btn" onclick="downloadSvg()">💾 Download SVG</button>
        <button class="action-btn" onclick="window.print()">🖨️ Print / PDF</button>
      </div>
    </header>

    <!-- Graphic Display Frame -->
    <div class="graphic-card">
      <object id="svg-viewer" type="image/svg+xml" data="assets/system-compass-architecture.svg?v=9.0.8"></object>
    </div>
  </div>

  <div class="toast" id="toast">SVG copied to clipboard!</div>

  <script>
    async function copySvg() {
      try {
        const res = await fetch('assets/system-compass-architecture.svg');
        const text = await res.text();
        await navigator.clipboard.writeText(text);
        showToast('SVG copied to clipboard!');
      } catch (e) {
        showToast('Error copying SVG: ' + e.message);
      }
    }

    function downloadSvg() {
      const a = document.createElement('a');
      a.href = 'assets/system-compass-architecture.svg';
      a.download = 'margo-system-compass.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('Downloading SVG...');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }
  </script>
</body>
</html>
