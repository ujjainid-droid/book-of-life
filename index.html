<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="margo">
  <meta name="theme-color" content="#F4F5FB">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>margo</title>
  
  <!-- Google Fonts: Inter & Newsreader for Nordic Editorial aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Modular Stylesheets with Cache Buster -->
  <link rel="stylesheet" href="css/nordic-theme.css?v=2.5">
  <link rel="stylesheet" href="css/layout.css?v=2.5">
  <link rel="stylesheet" href="css/cover.css?v=2.5">
  <link rel="stylesheet" href="css/habits.css?v=2.5">
  <link rel="stylesheet" href="css/tasks.css?v=2.5">
  <link rel="stylesheet" href="css/settings.css?v=2.5">
  <link rel="stylesheet" href="css/claims.css?v=2.5">
</head>
<body>

  <div class="book-app">
    <!-- Header -->
    <header class="book-header">
      <div class="book-title-area">
        <h1>margo</h1>
      </div>

      <!-- View Switcher Navigation (Daily vs Medical Claims) -->
      <nav class="header-view-nav">
        <button class="view-nav-btn active" id="nav-btn-daily" onclick="switchAppView('daily')" title="Daily Habits &amp; Momentum">
          <i data-lucide="check-circle-2" style="width: 14px; height: 14px;"></i>
          <span>Daily</span>
        </button>
        <button class="view-nav-btn" id="nav-btn-claims" onclick="switchAppView('claims')" title="Medical Claims &amp; Recovery Tracker">
          <i data-lucide="receipt" style="width: 14px; height: 14px;"></i>
          <span>Claims</span>
          <span class="claims-badge-pill" id="header-claims-badge" style="display: none;"></span>
        </button>
      </nav>

      <div class="header-date-nav" id="header-date-nav-container">
        <button class="date-nav-btn" onclick="navigateDate(-1)" title="Previous Day">
          <i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i>
        </button>
        <button class="date-current-btn" id="header-date-label" onclick="handleHeaderDateClick()" title="Jump to Today or Pick Date">
          Today
        </button>
        <input type="date" id="header-date-picker-input" class="hidden-date-picker" onchange="onHeaderDatePicked(this.value)">
        <button class="date-nav-btn" onclick="navigateDate(1)" title="Next Day">
          <i data-lucide="chevron-right" style="width: 16px; height: 16px;"></i>
        </button>
        <button class="date-nav-btn" onclick="triggerHeaderDatePicker()" title="Pick Specific Date From Calendar">
          <i data-lucide="calendar" style="width: 14px; height: 14px;"></i>
        </button>
      </div>

      <div class="header-actions">
        <button class="icon-btn" title="Toggle Light / Dark Theme" onclick="toggleTheme()">
          <i data-lucide="moon" id="header-theme-icon" style="width: 18px; height: 18px;"></i>
        </button>
        <button class="icon-btn" title="Settings & Preferences" onclick="openSettingsModal()">
          <i data-lucide="settings" style="width: 18px; height: 18px;"></i>
        </button>
      </div>
    </header>

    <!-- Single Daily Sheet Frame -->
    <main class="daily-sheet-container" id="daily-sheet-container"></main>
  </div>

  <!-- ==================== MODALS ==================== -->

  <!-- Add Habit Modal -->
  <div class="modal-overlay" id="modal-add-habit" onclick="if(event.target === this) closeAllModals()">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add New Habit</h3>
        <button class="icon-btn" onclick="closeAllModals()"><i data-lucide="x"></i></button>
      </div>
      <form onsubmit="submitAddHabit(event)">
        <div class="form-group">
          <label class="form-label">Habit Name</label>
          <input type="text" class="form-input" id="habit-name-input" placeholder="e.g. Move, 10k Steps, Hydrate 2L, Read 20m..." required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">MARGO Category</label>
            <select class="form-select" id="habit-bucket-select">
              <option value="M" selected>M — Move (Fitness, Steps, Workout)</option>
              <option value="A">A — Aesthetic (Skincare, Outfits)</option>
              <option value="R">R — Reflect (Meditate, Journal, Me time)</option>
              <option value="G">G — Grow (Reading, Skills, Hobbies)</option>
              <option value="O">O — Organize (Routines, Finances)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Frequency / Cadence</label>
            <select class="form-select" id="habit-cadence-select" onchange="onCadenceChange(this.value, 'habit-target-group')">
              <option value="daily" selected>Daily (Every Day)</option>
              <option value="weekly">Target Times / Week</option>
            </select>
          </div>
        </div>

        <div class="form-group" id="habit-target-group" style="display: none;">
          <label class="form-label">Weekly Target (Days per week)</label>
          <input type="number" min="1" max="7" class="form-input" id="habit-target-input" value="3">
        </div>

        <div class="form-group">
          <label class="form-label">Context / Motivation Note (Optional)</label>
          <input type="text" class="form-input" id="habit-desc-input" placeholder="e.g. 10 minutes right after waking up">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" class="btn btn-secondary" onclick="closeAllModals()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Habit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Habit Modal -->
  <div class="modal-overlay" id="modal-edit-habit" onclick="if(event.target === this) closeAllModals()">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Edit Habit</h3>
        <button class="icon-btn" onclick="closeAllModals()"><i data-lucide="x"></i></button>
      </div>
      <form onsubmit="submitEditHabit(event)">
        <div class="form-group">
          <label class="form-label">Habit Name</label>
          <input type="text" class="form-input" id="edit-habit-name-input" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">MARGO Category</label>
            <select class="form-select" id="edit-habit-bucket-select">
              <option value="M">M — Move</option>
              <option value="A">A — Aesthetic</option>
              <option value="R">R — Reflect</option>
              <option value="G">G — Grow</option>
              <option value="O">O — Organize</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Frequency / Cadence</label>
            <select class="form-select" id="edit-habit-cadence-select" onchange="onCadenceChange(this.value, 'edit-habit-target-group')">
              <option value="daily">Daily (Every Day)</option>
              <option value="weekly">Target Times / Week</option>
            </select>
          </div>
        </div>

        <div class="form-group" id="edit-habit-target-group" style="display: none;">
          <label class="form-label">Weekly Target (Days per week)</label>
          <input type="number" min="1" max="7" class="form-input" id="edit-habit-target-input" value="3">
        </div>

        <div class="form-group">
          <label class="form-label">Context / Motivation Note (Optional)</label>
          <input type="text" class="form-input" id="edit-habit-desc-input">
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
          <button type="button" class="btn btn-secondary" style="color: var(--danger);" onclick="deleteCurrentEditingHabit()">
            <i data-lucide="trash-2" style="width: 15px; height: 15px;"></i> Delete Habit
          </button>
          <div style="display: flex; gap: 10px;">
            <button type="button" class="btn btn-secondary" onclick="closeAllModals()">Cancel</button>
            <button type="submit" class="btn btn-primary">Update Habit</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Catch-Up Past Days Modal -->
  <div class="modal-overlay" id="modal-past-days" onclick="if(event.target === this) closeAllModals()">
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <i data-lucide="calendar-check-2" style="color: var(--primary);"></i>
          <h3>Catch-Up Past Days</h3>
        </div>
        <button class="icon-btn" onclick="closeAllModals()"><i data-lucide="x"></i></button>
      </div>
      <div id="past-days-modal-body"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="modal-settings" onclick="if(event.target === this) closeAllModals()">
    <div class="modal-card modal-card-lg">
      <div class="modal-header">
        <h3>Settings & Preferences</h3>
        <button class="icon-btn" onclick="closeAllModals()"><i data-lucide="x"></i></button>
      </div>
      <div id="settings-modal-body"></div>
    </div>
  </div>

  <!-- Cloud Sync Pairing Modal -->
  <div class="modal-overlay" id="modal-sync-pair" onclick="if(event.target === this) closeAllModals()">
    <div class="modal-card">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <i data-lucide="smartphone" style="color: var(--primary);"></i>
          <h3>Pair with iPhone</h3>
        </div>
        <button class="icon-btn" onclick="closeAllModals()"><i data-lucide="x"></i></button>
      </div>
      <div id="sync-pair-modal-body" style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px;"></div>
    </div>
  </div>

  <!-- Included Health Export Modal -->
  <div class="modal-overlay" id="modal-export-claims" onclick="if(event.target === this) closeAllModals()">
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <i data-lucide="copy" style="color: var(--primary);"></i>
          <h3>Copy for Included Health</h3>
        </div>
        <button class="icon-btn" onclick="closeAllModals()"><i data-lucide="x"></i></button>
      </div>
      <div id="export-claims-body"></div>
    </div>
  </div>

  <!-- Edit Claim Modal -->
  <div class="modal-overlay" id="modal-edit-claim" onclick="if(event.target === this) closeAllModals()">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Edit Medical Claim</h3>
        <button class="icon-btn" onclick="closeAllModals()"><i data-lucide="x"></i></button>
      </div>
      <form id="edit-claim-form" onsubmit="submitEditClaim(event)">
        <div class="form-group">
          <label class="form-label">Date of Service</label>
          <input type="date" class="form-input" id="edit-claim-date" required>
        </div>
        <div class="form-group">
          <label class="form-label">Provider Name</label>
          <input type="text" class="form-input" id="edit-claim-provider" required>
        </div>
        <div class="form-group">
          <label class="form-label">Amount Paid ($)</label>
          <input type="number" step="0.01" min="0" class="form-input" id="edit-claim-amount" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">Who Submits Claim?</label>
            <select class="form-select" id="edit-claim-submission">
              <option value="provider">🏢 Provider Submits (Courtesy)</option>
              <option value="self">👤 I / Included Health Submit</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Expected Payout</label>
            <select class="form-select" id="edit-claim-payout">
              <option value="direct_deposit">🏦 Direct Deposit (Monarch)</option>
              <option value="check">✉️ Mailed Paper Check</option>
            </select>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">Superbill Status</label>
            <select class="form-select" id="edit-claim-superbill">
              <option value="have">✅ Superbill Attached</option>
              <option value="need">❌ Need Superbill</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Current Stage</label>
            <select class="form-select" id="edit-claim-stage">
              <option value="with_included_health">🔵 Pending Insurance</option>
              <option value="check_due">🟢 Check / Deposit Due</option>
              <option value="ready_to_send">🟡 Send to Included Health</option>
              <option value="need_superbill">🔴 Need Superbill</option>
              <option value="settled">⚪ Settled &amp; Reconciled</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Next Action</label>
          <input type="text" class="form-input" id="edit-claim-nextaction" placeholder="Immediate next move...">
        </div>
        <div class="form-group">
          <label class="form-label">Notes (Optional)</label>
          <textarea class="form-input" id="edit-claim-notes" rows="2" placeholder="e.g. Case number, provider phone, receipt notes..."></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px;">
          <button type="button" class="btn btn-secondary" onclick="closeAllModals()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application Scripts with Cache Buster -->
  <script src="js/margoData.js?v=2.6"></script>
  <script src="js/sync.js?v=2.6"></script>
  <script src="js/storage.js?v=2.6"></script>
  <script src="js/pages/coverPage.js?v=2.6"></script>
  <script src="js/pages/claimsPage.js?v=2.6"></script>
  <script src="js/app.js?v=2.6"></script>
</body>
</html>
