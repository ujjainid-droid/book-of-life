  <style>
    :root {
      --bg: #F5F3FA;
      --card: #FFFFFF;
      --text: #1E1B3A;
      --muted: #6B6785;
      --violet: #7C3AED;
      --violet-light: #EDE9FE;
      --border: rgba(124, 58, 237, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 40px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      max-width: 600px;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14.5px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1040px;
      width: 100%;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.05);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--violet);
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.12);
    }
    .card.active {
      border-color: var(--violet);
      background: #FAF8FF;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.25);
    }
    .current-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #FFFFFF;
      background: var(--violet);
      padding: 3px 8px;
      border-radius: 999px;
      display: none;
    }
    .card.active .current-badge {
      display: block;
    }
    .avatar-wrap {
      width: 100px;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(124, 58, 237, 0.04);
      border-radius: 20px;
      padding: 4px;
    }
    .card h3 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--violet);
      background: var(--violet-light);
      padding: 3px 10px;
      border-radius: 999px;
    }
    .card p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .select-btn {
      margin-top: auto;
      width: 100%;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--violet);
      background: #FFFFFF;
      color: var(--violet);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .select-btn:hover, .card.active .select-btn {
      background: var(--violet);
      color: #FFFFFF;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1E1B3A;
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

    const currentSaved = localStorage.getItem('BOL_COMPASS_AVATAR_PRESET') || 'smirk';

    function renderGrid() {
      const grid = document.getElementById('avatar-grid');
      grid.innerHTML = AVATARS.map(item => `
        <div class="card ${item.id === currentSaved ? 'active' : ''}" onclick="selectAvatar('${item.id}')">
          <span class="current-badge">Active</span>
          <div class="avatar-wrap">${item.svg}</div>
          <span class="badge">${item.badge}</span>
          <h3>${item.title}</h3>
          <p>${item.desc}</p>
          <button class="select-btn">${item.id === currentSaved ? '✓ Selected' : 'Use this Avatar'}</button>
        </div>
      `).join('');
    }

    function selectAvatar(id) {
      localStorage.setItem('BOL_COMPASS_AVATAR_PRESET', id);
      showToast('✓ Set as Compass Avatar! Refreshing Compass...');
      setTimeout(() => {
        window.location.reload();
      }, 700);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    renderGrid();
  </script>
