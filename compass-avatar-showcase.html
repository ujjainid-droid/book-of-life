  <style>
    :root {
      --bg: #F5F3FA;
      --card: #FFFFFF;
      --text: #1E1B3A;
      --muted: #6B6785;
      --violet: #7C3AED;
      --violet-light: #EDE9FE;
      --border: rgba(124, 58, 237, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 40px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      max-width: 680px;
      margin-bottom: 36px;
    }
    .header h1 {
      font-size: 30px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .header p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1080px;
      width: 100%;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.05);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--violet);
      box-shadow: 0 14px 34px rgba(124, 58, 237, 0.14);
    }
    .card.active {
      border-color: var(--violet);
      background: #FAF8FF;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.25);
    }
    .current-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #FFFFFF;
      background: var(--violet);
      padding: 4px 10px;
      border-radius: 999px;
      display: none;
    }
    .card.active .current-badge {
      display: block;
    }
    .avatar-wrap {
      width: 116px;
      height: 124px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(124, 58, 237, 0.04);
      border-radius: 24px;
      padding: 6px;
      transition: transform 0.2s ease;
    }
    .card:hover .avatar-wrap {
      transform: scale(1.05);
    }
    .card h3 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }
    .badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--violet);
      background: var(--violet-light);
      padding: 4px 12px;
      border-radius: 999px;
    }
    .card p {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.5;
    }
    .select-btn {
      margin-top: auto;
      width: 100%;
      padding: 12px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--violet);
      background: #FFFFFF;
      color: var(--violet);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .select-btn:hover, .card.active .select-btn {
      background: var(--violet);
      color: #FFFFFF;
    }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1E1B3A;
      color: #FFFFFF;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

    const currentSaved = localStorage.getItem('BOL_COMPASS_AVATAR_PRESET') || 'headphones-bob';

    function renderGrid() {
      const grid = document.getElementById('avatar-grid');
      grid.innerHTML = AVATARS.map(item => `
        <div class="card ${item.id === currentSaved ? 'active' : ''}" onclick="selectAvatar('${item.id}')">
          <span class="current-badge">Active</span>
          <div class="avatar-wrap">${item.svg}</div>
          <span class="badge">${item.badge}</span>
          <h3>${item.title}</h3>
          <p>${item.desc}</p>
          <button class="select-btn">${item.id === currentSaved ? '✓ Selected' : 'Preview this in App'}</button>
        </div>
      `).join('');
    }

    function selectAvatar(id) {
      localStorage.setItem('BOL_COMPASS_AVATAR_PRESET', id);
      showToast('✓ Set as Compass Avatar! Refreshing...');
      setTimeout(() => {
        window.location.reload();
      }, 700);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    renderGrid();
  </script>
