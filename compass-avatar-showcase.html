<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compass Cartoon Avatars · Art Style Exploration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F3FA;
      --card: #FFFFFF;
      --text: #191426;
      --muted: #6B6582;
      --violet: #7C3AED;
      --violet-light: #EDE9FE;
      --border: rgba(124, 58, 237, 0.14);
      --teal: #0D98BA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 40px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      max-width: 760px;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 34px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.025em;
    }
    .header p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 15.5px;
      line-height: 1.5;
    }
    .section-title {
      max-width: 1120px;
      width: 100%;
      margin: 10px 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-title h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
    }
    .section-title .pill {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--violet-light);
      color: var(--violet);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
      max-width: 1120px;
      width: 100%;
      margin-bottom: 40px;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.05);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--violet);
      box-shadow: 0 16px 36px rgba(124, 58, 237, 0.15);
    }
    .card.active {
      border-color: var(--violet);
      background: #FAF8FF;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.25);
    }
    .current-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #FFFFFF;
      background: var(--violet);
      padding: 3px 9px;
      border-radius: 999px;
      display: none;
    }
    .card.active .current-badge {
      display: block;
    }
    .img-avatar-wrap {
      width: 100%;
      height: 220px;
      border-radius: 16px;
      overflow: hidden;
      background: #EDE9FE;
      box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.1);
    }
    .img-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .card:hover .img-avatar-wrap img {
      transform: scale(1.04);
    }
    .badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--violet);
      background: var(--violet-light);
      padding: 3px 10px;
      border-radius: 999px;
    }
    .card h3 {
      font-size: 17.5px;
      font-weight: 800;
      color: var(--text);
    }
    .card p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .select-btn {
      margin-top: auto;
      width: 100%;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--violet);
      background: #FFFFFF;
      color: var(--violet);
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .select-btn:hover, .card.active .select-btn {
      background: var(--violet);
      color: #FFFFFF;
    }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #191426;
      color: #FFFFFF;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Compass Cartoon Avatar Gallery</h1>
    <p>We've created 4 completely new cartoon styles (dark bob, lilac studio headphones, and royal violet knit). Browse the full illustrations below and choose your favorite.</p>
  </div>

  <div class="section-title">
    <h2>4 Distinct Illustrated Cartoon Styles</h2>
    <span class="pill">Full High-Res Edition</span>
  </div>

  <div class="grid" id="illustrated-grid"></div>

  <div id="toast" class="toast">✓ Avatar selected!</div>

  <script>
    const ILLUSTRATED = [
      {
        id: 'img-ghibli',
        title: '1. Studio Ghibli / Lofi Anime',
        badge: 'Hand-Drawn Anime Warmth',
        img: 'img/avatars/avatar-ghibli.jpg',
        desc: 'Serene watercolor hand-drawn anime portrait. Gentle glowing warm eyes, soft breeze-swept dark bob, lilac headphones & quiet indoor plants.'
      },
      {
        id: 'img-rubberhose',
        title: '2. 1930s Retro Rubber-Hose',
        badge: 'Vintage Fleischer / Cuphead',
        img: 'img/avatars/avatar-rubberhose.jpg',
        desc: 'Playful 1930s animation aesthetic. Iconic pie-cut eyes, bouncy curved vintage lines, sepia paper texture, vintage headphones & cheeky smile.'
      },
      {
        id: 'img-kawaii',
        title: '3. Kawaii / Chibi Sanrio Mascot',
        badge: 'Cute Mascot / Sticker Style',
        img: 'img/avatars/avatar-kawaii.jpg',
        desc: 'Ultra-cute chibi proportions with huge starry sparkle eyes, chubby cheeks, pastel lilac cat-ear headphones & cozy oversized violet knit.'
      },
      {
        id: 'img-y2k',
        title: '4. Bold Y2K Graphic Cartoon',
        badge: 'Cartoon Network / Kim Possible',
        desc: 'Razor-sharp graphic vector art with angular linework, bold winged cat-eye, confident wink & high-energy futuristic violet pop backdrop.'
      }
    ];

    const currentSaved = localStorage.getItem('BOL_COMPASS_AVATAR_PRESET') || 'headphones-bob';

    function renderGrids() {
      const ig = document.getElementById('illustrated-grid');
      ig.innerHTML = ILLUSTRATED.map(item => `
        <div class="card ${item.id === currentSaved ? 'active' : ''}" onclick="selectAvatar('${item.id}')">
          <span class="current-badge">Active</span>
          <div class="img-avatar-wrap">
            <img src="${item.img}" alt="${item.title}">
          </div>
          <span class="badge">${item.badge}</span>
          <h3>${item.title}</h3>
          <p>${item.desc}</p>
          <button class="select-btn">${item.id === currentSaved ? '✓ Selected' : 'Preview this Style'}</button>
        </div>
      `).join('');
    }

    function selectAvatar(id) {
      localStorage.setItem('BOL_COMPASS_AVATAR_PRESET', id);
      showToast('✓ Selected ' + id + ' for Compass! Updating...');
      setTimeout(() => {
        window.location.reload();
      }, 700);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    renderGrids();
  </script>
</body>
</html>
