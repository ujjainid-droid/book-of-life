<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif;">
  <defs>
    <filter id="shadow-opt2" x="-6%" y="-8%" width="112%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.05"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.03"/>
    </filter>

    <marker id="arr-v2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-b2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Frame Card -->
  <rect x="14" y="14" width="512" height="532" rx="26" fill="#FFFFFF" stroke="rgba(124, 58, 237, 0.12)" stroke-width="1.5" filter="url(#shadow-opt2)"/>

  <!-- Title -->
  <g transform="translate(42, 40)">
    <text x="0" y="16" font-size="22" font-weight="700" fill="#1E1B4B" letter-spacing="-0.02em">System compass</text>
    <text x="0" y="34" font-size="12.5" font-weight="500" fill="#64748B">Option 2 · Single Spine Timeline</text>
  </g>

  <!-- Central Spine Guide Lines -->
  <!-- Line 1: margo ➔ Gmail -->
  <line x1="68" y1="140" x2="68" y2="164" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Line 2: Gmail ➔ Things 3 -->
  <line x1="68" y1="218" x2="68" y2="242" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Line 3: Things 3 ➔ Apple Notes -->
  <line x1="68" y1="340" x2="68" y2="364" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Line 4: Apple Notes ➔ Google Drive -->
  <line x1="68" y1="418" x2="68" y2="442" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Notes Loop back to margo (Left Arc) -->
  <path d="M 44 391 C 18 391, 18 113, 44 113" fill="none" stroke="#8B5CF6" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arr-v2)"/>

  <!-- ================= 1. MARGO ================= -->
  <g transform="translate(44, 86)">
    <!-- Circle Icon: m -->
    <circle cx="24" cy="27" r="21" fill="#FAF9FE" stroke="#DDD6FE" stroke-width="1.4"/>
    <text x="24" y="35" font-family="'Newsreader', Georgia, serif" font-size="24" font-weight="700" font-style="italic" fill="#7C3AED" text-anchor="middle">m</text>
    
    <text x="62" y="34" font-size="18" font-weight="700" fill="#1E1B4B">margo</text>

    <!-- Badge -->
    <g transform="translate(296, 14)">
      <rect x="0" y="0" width="156" height="26" rx="8" fill="#F3EEFF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="78" y="17" font-size="9.5" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="0.04em">COMMAND &amp; CONTROL</text>
    </g>
  </g>

  <!-- ================= 2. GMAIL ================= -->
  <g transform="translate(44, 164)">
    <!-- Circle Icon: ✉ -->
    <circle cx="24" cy="27" r="21" fill="#FFFBFB" stroke="#FECDD3" stroke-width="1.4"/>
    <path d="M 15 19 L 33 19 C 34.1 19 35 19.9 35 21 L 35 31 C 35 32.1 34.1 33 33 33 L 15 33 C 13.9 33 13 32.1 13 31 L 13 21 C 13 19.9 13.9 19 15 19 Z" fill="none" stroke="#E11D48" stroke-width="1.6"/>
    <path d="M 13 21 L 24 28 L 35 21" fill="none" stroke="#E11D48" stroke-width="1.6" stroke-linecap="round"/>

    <text x="62" y="34" font-size="18" font-weight="700" fill="#1E1B4B">Gmail</text>

    <!-- Badge -->
    <g transform="translate(322, 14)">
      <rect x="0" y="0" width="130" height="26" rx="8" fill="#FFE4E6" stroke="#FECDD3" stroke-width="1"/>
      <text x="65" y="17" font-size="9.5" font-weight="700" fill="#BE123C" text-anchor="middle" letter-spacing="0.04em">INFLOW &amp; SIGNAL</text>
    </g>
  </g>

  <!-- ================= 3. THINGS 3 ================= -->
  <g transform="translate(44, 242)">
    <circle cx="24" cy="27" r="21" fill="#FBFDFF" stroke="#BFDBFE" stroke-width="1.4"/>
    <text x="24" y="34" font-size="16" font-weight="800" fill="#2563EB" text-anchor="middle">T3</text>

    <text x="62" y="34" font-size="18" font-weight="700" fill="#1E1B4B">Things 3</text>

    <!-- Badge -->
    <g transform="translate(352, 14)">
      <rect x="0" y="0" width="100" height="26" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="50" y="17" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.04em">EXECUTION</text>
    </g>

    <!-- 3 Tags Row Below -->
    <g transform="translate(62, 54)">
      <!-- Tag 1: #active · #high priority -->
      <rect x="0" y="0" width="184" height="30" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="92" y="15" font-size="9.5" font-weight="700" fill="#6D28D9" text-anchor="middle">#active · #high priority</text>
      <text x="92" y="25" font-size="8" font-weight="600" fill="#7C3AED" text-anchor="middle">(to be done first)</text>

      <!-- Tag 2: #active -->
      <rect x="192" y="0" width="94" height="30" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
      <text x="239" y="19" font-size="10.5" font-weight="700" fill="#1E40AF" text-anchor="middle">#active</text>

      <!-- Tag 3: #later -->
      <rect x="294" y="0" width="88" height="30" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
      <text x="338" y="19" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">#later</text>
    </g>
  </g>

  <!-- ================= 4. APPLE NOTES ================= -->
  <g transform="translate(44, 364)">
    <circle cx="24" cy="27" r="21" fill="#FAF9FE" stroke="#DDD6FE" stroke-width="1.4"/>
    <text x="24" y="34" font-size="17" font-weight="800" fill="#7C3AED" text-anchor="middle">N</text>

    <text x="62" y="34" font-size="18" font-weight="700" fill="#1E1B4B">Apple Notes</text>

    <g transform="translate(326, 14)">
      <rect x="0" y="0" width="126" height="26" rx="8" fill="#F3EEFF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="63" y="17" font-size="9.5" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="0.04em">MASTER NOTES</text>
    </g>
  </g>

  <!-- ================= 5. GOOGLE DRIVE ================= -->
  <g transform="translate(44, 442)">
    <circle cx="24" cy="27" r="21" fill="#F4FBF9" stroke="#99F6E4" stroke-width="1.4"/>
    <text x="24" y="34" font-size="17" font-weight="800" fill="#0D98BA" text-anchor="middle">G</text>

    <text x="62" y="34" font-size="18" font-weight="700" fill="#1E1B4B">Google Drive</text>

    <g transform="translate(328, 14)">
      <rect x="0" y="0" width="124" height="26" rx="8" fill="#CCFBF1" stroke="#99F6E4" stroke-width="1"/>
      <text x="62" y="17" font-size="9.5" font-weight="700" fill="#0E7490" text-anchor="middle" letter-spacing="0.04em">MASTER VAULT</text>
    </g>
  </g>
</svg>
