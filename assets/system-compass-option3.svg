<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif;">
  <defs>
    <filter id="shadow-opt3" x="-6%" y="-8%" width="112%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.05"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.03"/>
    </filter>

    <marker id="arr-v3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-r3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
    <marker id="arr-b3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-t3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0D9488"/>
    </marker>
  </defs>

  <!-- Card Frame -->
  <rect x="14" y="14" width="732" height="472" rx="24" fill="#FFFFFF" stroke="rgba(124, 58, 237, 0.12)" stroke-width="1.5" filter="url(#shadow-opt3)"/>

  <!-- Title -->
  <g transform="translate(44, 40)">
    <text x="0" y="16" font-size="22" font-weight="700" fill="#1E1B4B" letter-spacing="-0.02em">System compass</text>
    <text x="0" y="34" font-size="12.5" font-weight="500" fill="#64748B">Option 3 · Symmetrical Command Grid</text>
  </g>

  <!-- Connectors -->
  <!-- margo ➔ Things 3 -->
  <path d="M 500 142 L 500 176" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-v3)"/>

  <!-- Gmail ➔ Things 3 -->
  <path d="M 244 234 L 280 234" fill="none" stroke="#E11D48" stroke-width="2" marker-end="url(#arr-r3)"/>

  <!-- Things 3 ➔ Apple Notes -->
  <path d="M 370 294 L 230 380" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arr-b3)"/>

  <!-- Apple Notes ↺ Loop back to margo -->
  <path d="M 120 380 C 24 380, 24 115, 120 115" fill="none" stroke="#8B5CF6" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arr-v3)"/>

  <!-- Apple Notes ➔ Google Drive -->
  <path d="M 370 415 L 406 415" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arr-t3)"/>

  <!-- ================= 1. MARGO (TOP HEADER CARD) ================= -->
  <g transform="translate(44, 86)">
    <rect x="0" y="0" width="672" height="56" rx="15" fill="#FAF9FE" stroke="rgba(124, 58, 237, 0.18)" stroke-width="1.2"/>
    <g transform="translate(12, 9)">
      <circle cx="19" cy="19" r="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
      <text x="19" y="26" font-family="'Newsreader', Georgia, serif" font-size="22" font-weight="700" font-style="italic" fill="#7C3AED" text-anchor="middle">m</text>
    </g>
    <text x="62" y="34" font-size="18" font-weight="700" fill="#1E1B4B">margo</text>
    <g transform="translate(498, 15)">
      <rect x="0" y="0" width="162" height="26" rx="8" fill="#F3EEFF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="81" y="17" font-size="9.5" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="0.04em">COMMAND &amp; CONTROL</text>
    </g>
  </g>

  <!-- ================= 2. GMAIL (LEFT MID) ================= -->
  <g transform="translate(44, 176)">
    <rect x="0" y="0" width="200" height="116" rx="16" fill="#FFFBFB" stroke="rgba(225, 29, 72, 0.18)" stroke-width="1.2"/>
    <g transform="translate(14, 16)">
      <circle cx="20" cy="20" r="19" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.2"/>
      <path d="M 12 14 L 28 14 C 29 14 30 14.8 30 15.8 L 30 24.2 C 30 25.2 29 26 28 26 L 12 26 C 11 26 10 25.2 10 24.2 L 10 15.8 C 10 14.8 11 14 12 14 Z" fill="none" stroke="#E11D48" stroke-width="1.5"/>
      <path d="M 10 16 L 20 22 L 30 16" fill="none" stroke="#E11D48" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="64" y="42" font-size="18" font-weight="700" fill="#1E1B4B">Gmail</text>
    <g transform="translate(14, 70)">
      <rect x="0" y="0" width="172" height="28" rx="8" fill="#FFE4E6" stroke="#FECDD3" stroke-width="1"/>
      <text x="86" y="18" font-size="9.5" font-weight="700" fill="#BE123C" text-anchor="middle" letter-spacing="0.04em">INFLOW &amp; SIGNAL</text>
    </g>
  </g>

  <!-- ================= 3. THINGS 3 (RIGHT MID) ================= -->
  <g transform="translate(280, 176)">
    <rect x="0" y="0" width="436" height="116" rx="16" fill="#FBFDFF" stroke="rgba(37, 99, 235, 0.2)" stroke-width="1.3"/>
    <g transform="translate(12, 12)">
      <circle cx="19" cy="19" r="18" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
      <text x="19" y="25" font-size="14" font-weight="800" fill="#2563EB" text-anchor="middle">T3</text>
    </g>
    <text x="60" y="36" font-size="18" font-weight="700" fill="#1E1B4B">Things 3</text>
    <g transform="translate(320, 14)">
      <rect x="0" y="0" width="104" height="26" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="52" y="17" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.04em">EXECUTION</text>
    </g>

    <!-- 3 Tags -->
    <g transform="translate(12, 64)">
      <!-- Tag 1: #active · #high priority -->
      <rect x="0" y="0" width="194" height="34" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="97" y="16" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle">#active · #high priority</text>
      <text x="97" y="27" font-size="8.5" font-weight="600" fill="#7C3AED" text-anchor="middle">(to be done first)</text>

      <!-- Tag 2: #active -->
      <rect x="202" y="0" width="110" height="34" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
      <text x="257" y="21" font-size="11" font-weight="700" fill="#1E40AF" text-anchor="middle">#active</text>

      <!-- Tag 3: #later -->
      <rect x="320" y="0" width="92" height="34" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
      <text x="366" y="21" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">#later</text>
    </g>
  </g>

  <!-- ================= 4. APPLE NOTES (BOTTOM LEFT) ================= -->
  <g transform="translate(44, 380)">
    <rect x="0" y="0" width="326" height="70" rx="16" fill="#FAF9FE" stroke="rgba(124, 58, 237, 0.18)" stroke-width="1.2"/>
    <g transform="translate(12, 16)">
      <circle cx="19" cy="19" r="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
      <text x="19" y="25" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="middle">N</text>
    </g>
    <text x="60" y="32" font-size="17" font-weight="700" fill="#1E1B4B">Apple Notes</text>
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="116" height="20" rx="6" fill="#F3EEFF" stroke="#DDD6FE" stroke-width="0.8"/>
      <text x="58" y="14" font-size="8.5" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="0.03em">MASTER NOTES</text>
    </g>
  </g>

  <!-- ================= 5. GOOGLE DRIVE (BOTTOM RIGHT) ================= -->
  <g transform="translate(406, 380)">
    <rect x="0" y="0" width="310" height="70" rx="16" fill="#F4FBF9" stroke="rgba(13, 148, 136, 0.2)" stroke-width="1.2"/>
    <g transform="translate(12, 16)">
      <circle cx="19" cy="19" r="18" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.2"/>
      <text x="19" y="25" font-size="15" font-weight="800" fill="#0D9488" text-anchor="middle">G</text>
    </g>
    <text x="60" y="32" font-size="17" font-weight="700" fill="#1E1B4B">Google Drive</text>
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="116" height="20" rx="6" fill="#CCFBF1" stroke="#99F6E4" stroke-width="0.8"/>
      <text x="58" y="14" font-size="8.5" font-weight="700" fill="#0F766E" text-anchor="middle" letter-spacing="0.03em">MASTER VAULT</text>
    </g>
  </g>
</svg>
