<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 404" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif;">
  <defs>
    <filter id="card-soft-shadow" x="-4%" y="-8%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.02"/>
    </filter>

    <marker id="arr-v-m" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-r-m" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E75480"/>
    </marker>
    <marker id="arr-b-m" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-b-m-rev" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-t-m" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0D98BA"/>
    </marker>
  </defs>

  <!-- Connectors -->
  <!-- 1. margo ➔ Gmail -->
  <line x1="38" y1="56" x2="38" y2="76" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-v-m)"/>

  <!-- 2. Gmail ➔ Things 3 -->
  <line x1="38" y1="124" x2="38" y2="144" stroke="#E75480" stroke-width="2" marker-end="url(#arr-r-m)"/>

  <!-- 3. Things 3 ⟷ Apple Notes (Bidirectional) -->
  <line x1="38" y1="236" x2="38" y2="256" stroke="#2563EB" stroke-width="2" marker-start="url(#arr-b-m-rev)" marker-end="url(#arr-b-m)"/>

  <!-- 4. Apple Notes ↺ Loop back to margo (Outer left perimeter) -->
  <path d="M 12 280 C 1 280, 1 32, 12 32" fill="none" stroke="#8B5CF6" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arr-v-m)"/>

  <!-- 5. Apple Notes ➔ Google Drive -->
  <line x1="38" y1="304" x2="38" y2="324" stroke="#0D98BA" stroke-width="2" marker-end="url(#arr-t-m)"/>

  <!-- ================= 1. MARGO ================= -->
  <g transform="translate(14, 8)">
    <rect x="0" y="0" width="324" height="48" rx="13" fill="#FAF9FE" stroke="rgba(124, 58, 237, 0.18)" stroke-width="1.2" filter="url(#card-soft-shadow)"/>
    <circle cx="24" cy="24" r="15" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
    <text x="24" y="30" font-family="'Newsreader', Georgia, serif" font-size="19" font-weight="700" font-style="italic" fill="#7C3AED" text-anchor="middle">m</text>
    
    <text x="50" y="30" font-size="15" font-weight="700" fill="#1E1B4B">margo</text>

    <g transform="translate(186, 12)">
      <rect x="0" y="0" width="126" height="24" rx="6" fill="#F3EEFF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="63" y="16" font-size="8.5" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="0.04em">COMMAND &amp; CONTROL</text>
    </g>
  </g>

  <!-- ================= 2. GMAIL ================= -->
  <g transform="translate(14, 76)">
    <rect x="0" y="0" width="324" height="48" rx="13" fill="#FFFBFB" stroke="rgba(231, 84, 128, 0.22)" stroke-width="1.2" filter="url(#card-soft-shadow)"/>
    <circle cx="24" cy="24" r="15" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.2"/>
    <path d="M 16 17 L 32 17 C 32.8 17 33.5 17.7 33.5 18.5 L 33.5 25.5 C 33.5 26.3 32.8 27 32 27 L 16 27 C 15.2 27 14.5 26.3 14.5 25.5 L 14.5 18.5 C 14.5 17.7 15.2 17 16 17 Z" fill="none" stroke="#E75480" stroke-width="1.4"/>
    <path d="M 14.5 18.5 L 24 23.5 L 33.5 18.5" fill="none" stroke="#E75480" stroke-width="1.4" stroke-linecap="round"/>

    <text x="50" y="30" font-size="15" font-weight="700" fill="#1E1B4B">Gmail</text>

    <g transform="translate(204, 12)">
      <rect x="0" y="0" width="108" height="24" rx="6" fill="#FFEAF1" stroke="#FECDD3" stroke-width="0.8"/>
      <text x="54" y="16" font-size="8.5" font-weight="700" fill="#E75480" text-anchor="middle" letter-spacing="0.03em">INFLOW &amp; SIGNAL</text>
    </g>
  </g>

  <!-- ================= 3. THINGS 3 ================= -->
  <g transform="translate(14, 144)">
    <rect x="0" y="0" width="324" height="92" rx="14" fill="#FBFDFF" stroke="rgba(37, 99, 235, 0.2)" stroke-width="1.3" filter="url(#card-soft-shadow)"/>
    
    <!-- Top Row: Icon + Title + EXECUTION Badge -->
    <circle cx="24" cy="24" r="15" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
    <text x="24" y="29" font-size="13" font-weight="800" fill="#2563EB" text-anchor="middle">T3</text>
    
    <text x="50" y="29" font-size="15" font-weight="700" fill="#1E1B4B">Things 3</text>

    <g transform="translate(226, 12)">
      <rect x="0" y="0" width="86" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="43" y="16" font-size="8.5" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.04em">EXECUTION</text>
    </g>

    <!-- 3 Tags Row Below -->
    <g transform="translate(10, 50)">
      <!-- Tag 1: #active · #high priority -->
      <rect x="0" y="0" width="168" height="30" rx="7" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="84" y="15" font-size="9.5" font-weight="700" fill="#6D28D9" text-anchor="middle">#active · #high priority</text>
      <text x="84" y="25" font-size="7.5" font-weight="600" fill="#7C3AED" text-anchor="middle">(to be done first)</text>

      <!-- Tag 2: #active -->
      <rect x="174" y="0" width="64" height="30" rx="7" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
      <text x="206" y="19" font-size="10.5" font-weight="700" fill="#1E40AF" text-anchor="middle">#active</text>

      <!-- Tag 3: #later -->
      <rect x="244" y="0" width="60" height="30" rx="7" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
      <text x="274" y="19" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">#later</text>
    </g>
  </g>

  <!-- ================= 4. APPLE NOTES ================= -->
  <g transform="translate(14, 256)">
    <rect x="0" y="0" width="324" height="48" rx="13" fill="#FAF9FE" stroke="rgba(124, 58, 237, 0.18)" stroke-width="1.2" filter="url(#card-soft-shadow)"/>
    <circle cx="24" cy="24" r="15" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
    <text x="24" y="29" font-size="14" font-weight="800" fill="#7C3AED" text-anchor="middle">N</text>
    
    <text x="50" y="30" font-size="15" font-weight="700" fill="#1E1B4B">Apple Notes</text>

    <g transform="translate(208, 12)">
      <rect x="0" y="0" width="104" height="24" rx="6" fill="#F3EEFF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="52" y="16" font-size="8.5" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="0.04em">MASTER NOTES</text>
    </g>
  </g>

  <!-- ================= 5. GOOGLE DRIVE ================= -->
  <g transform="translate(14, 324)">
    <rect x="0" y="0" width="324" height="48" rx="13" fill="#F4FBF9" stroke="rgba(13, 148, 136, 0.2)" stroke-width="1.2" filter="url(#card-soft-shadow)"/>
    <circle cx="24" cy="24" r="15" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.2"/>
    <text x="24" y="29" font-size="14" font-weight="800" fill="#0D98BA" text-anchor="middle">G</text>
    
    <text x="50" y="30" font-size="15" font-weight="700" fill="#1E1B4B">Google Drive</text>

    <g transform="translate(210, 12)">
      <rect x="0" y="0" width="102" height="24" rx="6" fill="#CCFBF1" stroke="#99F6E4" stroke-width="1"/>
      <text x="51" y="16" font-size="8.5" font-weight="700" fill="#0E7490" text-anchor="middle" letter-spacing="0.04em">MASTER VAULT</text>
    </g>
  </g>
</svg>
