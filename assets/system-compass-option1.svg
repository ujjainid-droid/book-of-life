<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 384" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif;">
  <defs>
    <filter id="shadow-tight" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7C3AED" flood-opacity="0.05"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.03"/>
    </filter>

    <marker id="arr-v-t" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-r-t" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E75480"/>
    </marker>
    <marker id="arr-b-t" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-b-t-rev" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-t-t" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0D98BA"/>
    </marker>
  </defs>

  <!-- ================= CONNECTORS ================= -->
  <!-- 1. margo ➔ Things 3 -->
  <path d="M 455 64 L 455 92" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-v-t)"/>

  <!-- 2. Gmail ➔ Things 3 -->
  <path d="M 186 146 L 218 146" fill="none" stroke="#E75480" stroke-width="2" marker-end="url(#arr-r-t)"/>

  <!-- 3. Things 3 ⟷ Apple Notes (Bidirectional) -->
  <path d="M 455 200 L 455 228" fill="none" stroke="#2563EB" stroke-width="2" marker-start="url(#arr-b-t-rev)" marker-end="url(#arr-b-t)"/>

  <!-- 4. Apple Notes ↺ Loop back to margo (Clean perimeter curve) -->
  <path d="M 218 256 C 14 256, 14 36, 218 36" fill="none" stroke="#8B5CF6" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-v-t)"/>

  <!-- 5. Apple Notes ➔ Google Drive -->
  <path d="M 455 284 L 455 314" fill="none" stroke="#0D98BA" stroke-width="2" marker-end="url(#arr-t-t)"/>

  <!-- ================= 1. MARGO ================= -->
  <g transform="translate(218, 8)">
    <rect x="0" y="0" width="484" height="56" rx="16" fill="#FAF9FE" stroke="rgba(124, 58, 237, 0.18)" stroke-width="1.2" filter="url(#shadow-tight)"/>
    <g transform="translate(12, 9)">
      <circle cx="19" cy="19" r="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
      <text x="19" y="26" font-family="'Newsreader', Georgia, serif" font-size="23" font-weight="700" font-style="italic" fill="#7C3AED" text-anchor="middle">m</text>
    </g>
    <text x="62" y="35" font-size="18" font-weight="700" fill="#1E1B4B">margo</text>
    <g transform="translate(318, 14)">
      <rect x="0" y="0" width="154" height="28" rx="8" fill="#F3EEFF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="77" y="18" font-size="9.5" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="0.04em">COMMAND &amp; CONTROL</text>
    </g>
  </g>

  <!-- ================= 2. GMAIL ================= -->
  <!-- Aligned with Things 3 (height 108) -->
  <g transform="translate(32, 92)">
    <rect x="0" y="0" width="154" height="108" rx="16" fill="#FFFBFB" stroke="rgba(231, 84, 128, 0.22)" stroke-width="1.2" filter="url(#shadow-tight)"/>
    <g transform="translate(14, 14)">
      <circle cx="19" cy="19" r="18" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.2"/>
      <path d="M 11 13 L 27 13 C 28 13 29 13.8 29 14.8 L 29 23.2 C 29 24.2 28 25 27 25 L 11 25 C 10 25 9 24.2 9 23.2 L 9 14.8 C 9 13.8 10 13 11 13 Z" fill="none" stroke="#E75480" stroke-width="1.5"/>
      <path d="M 9 15 L 19 21 L 29 15" fill="none" stroke="#E75480" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="58" y="38" font-size="17" font-weight="700" fill="#1E1B4B">Gmail</text>
    
    <g transform="translate(13, 64)">
      <rect x="0" y="0" width="128" height="28" rx="7" fill="#FFEAF1" stroke="#FECDD3" stroke-width="0.8"/>
      <text x="64" y="18" font-size="9" font-weight="700" fill="#E75480" text-anchor="middle" letter-spacing="0.03em">INFLOW &amp; SIGNAL</text>
    </g>
  </g>

  <!-- ================= 3. THINGS 3 ================= -->
  <g transform="translate(218, 92)">
    <rect x="0" y="0" width="484" height="108" rx="16" fill="#FBFDFF" stroke="rgba(37, 99, 235, 0.2)" stroke-width="1.3" filter="url(#shadow-tight)"/>
    <g transform="translate(12, 10)">
      <circle cx="19" cy="19" r="18" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
      <text x="19" y="25" font-size="14" font-weight="800" fill="#2563EB" text-anchor="middle">T3</text>
    </g>
    <text x="62" y="35" font-size="18" font-weight="700" fill="#1E1B4B">Things 3</text>
    <g transform="translate(366, 14)">
      <rect x="0" y="0" width="106" height="28" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="53" y="18" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.04em">EXECUTION</text>
    </g>

    <!-- 3 Tags Row -->
    <g transform="translate(10, 58)">
      <!-- Tag 1: #active · #high priority -->
      <rect x="0" y="0" width="210" height="36" rx="9" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="105" y="17" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">#active · #high priority</text>
      <text x="105" y="29" font-size="8.5" font-weight="600" fill="#7C3AED" text-anchor="middle">(to be done first)</text>

      <!-- Tag 2: #active -->
      <rect x="220" y="0" width="116" height="36" rx="9" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.1"/>
      <text x="278" y="22" font-size="11.5" font-weight="700" fill="#1E40AF" text-anchor="middle">#active</text>

      <!-- Tag 3: #later -->
      <rect x="346" y="0" width="118" height="36" rx="9" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.1"/>
      <text x="405" y="22" font-size="11.5" font-weight="700" fill="#15803D" text-anchor="middle">#later</text>
    </g>
  </g>

  <!-- ================= 4. APPLE NOTES ================= -->
  <g transform="translate(218, 228)">
    <rect x="0" y="0" width="484" height="56" rx="16" fill="#FAF9FE" stroke="rgba(124, 58, 237, 0.18)" stroke-width="1.2" filter="url(#shadow-tight)"/>
    <g transform="translate(12, 9)">
      <circle cx="19" cy="19" r="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
      <text x="19" y="25" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="middle">N</text>
    </g>
    <text x="62" y="35" font-size="18" font-weight="700" fill="#1E1B4B">Apple Notes</text>
    <g transform="translate(340, 14)">
      <rect x="0" y="0" width="132" height="28" rx="8" fill="#F3EEFF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="66" y="18" font-size="9.5" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="0.04em">MASTER NOTES</text>
    </g>
  </g>

  <!-- ================= 5. GOOGLE DRIVE ================= -->
  <g transform="translate(218, 314)">
    <rect x="0" y="0" width="484" height="56" rx="16" fill="#F4FBF9" stroke="rgba(13, 148, 136, 0.2)" stroke-width="1.2" filter="url(#shadow-tight)"/>
    <g transform="translate(12, 9)">
      <circle cx="19" cy="19" r="18" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.2"/>
      <text x="19" y="25" font-size="15" font-weight="800" fill="#0D98BA" text-anchor="middle">G</text>
    </g>
    <text x="62" y="35" font-size="18" font-weight="700" fill="#1E1B4B">Google Drive</text>
    <g transform="translate(342, 14)">
      <rect x="0" y="0" width="130" height="28" rx="8" fill="#CCFBF1" stroke="#99F6E4" stroke-width="1"/>
      <text x="65" y="18" font-size="9.5" font-weight="700" fill="#0E7490" text-anchor="middle" letter-spacing="0.04em">MASTER VAULT</text>
    </g>
  </g>
</svg>
